name: bankbridge-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q bankbridge
  jms-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: jms-worker/pom.xml
      - run: mvn -B -q -f jms-worker/pom.xml -DskipTests package
