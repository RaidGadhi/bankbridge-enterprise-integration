[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankbridge-enterprise-integration"
version = "1.0.0"
description = "Transactional banking integration proof-of-concept with IBM MQ and OpenShift adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "requests>=2.31,<3",
  "pydantic>=2.5,<3",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "PyYAML>=6,<7"]
events = ["kafka-python>=2.0.2,<3"]

[tool.setuptools.packages.find]
include = ["bankbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
