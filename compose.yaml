# Never use these demo defaults with real personal/financial data.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankbridge
      POSTGRES_USER: bankbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankbridge -d bankbridge"]
      interval: 4s
      retries: 30
    networks: [backend]
  api:
    build: .
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://bankbridge:${POSTGRES_PASSWORD}@db:5432/bankbridge
      BANKBRIDGE_API_KEY: ${BANKBRIDGE_API_KEY:?set BANKBRIDGE_API_KEY}
      BANKBRIDGE_INTERNAL_TOKEN: ${BANKBRIDGE_INTERNAL_TOKEN:?set BANKBRIDGE_INTERNAL_TOKEN}
      ALLOW_DEMO_SEED: 'true'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      retries: 30
    networks: [backend]
  local-worker:
    profiles: [local]
    build: .
    command: ["python", "-m", "bankbridge.worker", "local"]
    environment: *api-env
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]
  event-publisher:
    profiles: [events]
    build: .
    command: ["python", "-m", "bankbridge.events"]
    environment:
      <<: *api-env
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-bankbridge.payments.v1}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-token}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]
  mq:
    profiles: [ibm]
    image: icr.io/ibm-messaging/mq:9.3.5.1-r2
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_ADMIN_PASSWORD: ${MQ_ADMIN_PASSWORD:?set MQ_ADMIN_PASSWORD}
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD:?set MQ_APP_PASSWORD}
    volumes:
      - mqdata:/mnt/mqm
    ports:
      - '127.0.0.1:9443:9443'
      - '127.0.0.1:1414:1414'
    networks: [backend]
  mq-dispatcher:
    profiles: [ibm]
    build: .
    command: ["python", "-m", "bankbridge.worker", "mq"]
    environment:
      <<: *api-env
      MQ_REST_URL: https://mq:9443
      MQ_REST_USER: admin
      MQ_REST_PASSWORD: ${MQ_ADMIN_PASSWORD:?set MQ_ADMIN_PASSWORD}
      MQ_TLS_VERIFY: ${MQ_TLS_VERIFY:-false}
    depends_on:
      api: {condition: service_healthy}
      mq: {condition: service_started}
    networks: [backend]
  mq-consumer:
    profiles: [ibm]
    build: ./jms-worker
    environment:
      MQ_HOST: mq
      MQ_PORT: '1414'
      MQ_QMGR: QM1
      MQ_CHANNEL: DEV.APP.SVRCONN
      MQ_QUEUE: ${MQ_CONSUME_QUEUE:-DEV.QUEUE.1}
      MQ_USER: app
      MQ_PASSWORD: ${MQ_APP_PASSWORD:?set MQ_APP_PASSWORD}
      CORE_API: http://api:8000
      BANKBRIDGE_INTERNAL_TOKEN: ${BANKBRIDGE_INTERNAL_TOKEN:?set BANKBRIDGE_INTERNAL_TOKEN}
    depends_on:
      api: {condition: service_healthy}
      mq: {condition: service_started}
    networks: [backend]
volumes:
  pgdata:
  mqdata:
networks:
  backend:
